version: '3.8'

services:

  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    working_dir: /mlflow
    volumes:
      - ./mlflow_data:/mlflow
    ports:
      - "5001:5000"
    command: >
      sh -c "
      pip install mlflow==2.10.2 -q &&
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      "
  

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build: .
    container_name: automl-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./mlflow_data:/mlflow_data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GIT_PYTHON_REFRESH=quiet
    depends_on:
      - mlflow
    restart: on-failure

volumes:
  mlflow_data:
