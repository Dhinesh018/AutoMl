version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: automl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automl_pass}
      POSTGRES_DB: ${POSTGRES_DB:-automl_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - automl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automl_user} -d ${POSTGRES_DB:-automl_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow-server
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-automl_user}:${POSTGRES_PASSWORD:-automl_pass}@postgres:5432/${POSTGRES_DB:-automl_db}
      - ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    networks:
      - automl-network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-automl_user}:${POSTGRES_PASSWORD:-automl_pass}@postgres:5432/${POSTGRES_DB:-automl_db}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  automl-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automl-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
      - mlflow_data:/mlflow
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-automl_user}:${POSTGRES_PASSWORD:-automl_pass}@postgres:5432/${POSTGRES_DB:-automl_db}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - GIT_PYTHON_REFRESH=quiet
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - automl-network
    restart: on-failure
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: automl-frontend
    ports:
      - "5173:80"
    depends_on:
      - automl-api
    networks:
      - automl-network
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}

volumes:
  postgres_data:
  mlflow_data:

networks:
  automl-network:
    driver: bridge