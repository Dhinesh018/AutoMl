

services:
  postgres:
    image: postgres:15
    container_name: automl-postgres
    environment:
      POSTGRES_USER: automl_user
      POSTGRES_PASSWORD: automl_pass
      POSTGRES_DB: automl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - automl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automl_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: mlflow-server
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5001:5000"
    networks:
      - automl-network
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build: .
    container_name: automl-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - mlflow_data:/mlflow_data
      - ./logs:/app/logs 
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql://automl_user:automl_pass@postgres:5432/automl_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - GIT_PYTHON_REFRESH=quiet
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - automl-network
    restart: on-failure

volumes:
  mlflow_data:
  postgres_data:

networks:
  automl-network:
    driver: bridge