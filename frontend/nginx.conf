server {
    listen ${PORT};
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(auth|datasets|train|models|predict|health|api) {
        # 1. SWITCH TO HTTP: Avoid the SSL Handshake Alert 80 error
        proxy_pass http://automl-production-afc0.up.railway.app;
        
        proxy_set_header Host automl-production-afc0.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 2. SSL FIX: Disable verification in case Railway redirects back to HTTPS
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        
        # 3. ML STABILITY: Keeps connection alive for long training tasks
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}