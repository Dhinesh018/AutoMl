server {
    listen 80;
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # 1. THE BRIDGE: Send these specific backend routes to the FastAPI app
    # Add any other top-level routes your backend uses here (e.g. |datasets|train)
    location ~ ^/(auth|datasets|train|models|predict|health) {
        proxy_pass https://automl-production-afc0.up.railway.app;
        proxy_set_header Host automl-production-afc0.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # This ensures the POST request doesn't get turned into a GET
        proxy_http_version 1.1;
    }

    # 2. THE FRONTEND: Serve the React/Vite app
    location / {
        try_files $uri $uri/ /index.html;
    }
}