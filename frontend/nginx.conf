server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Handle Frontend Routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to the Backend using the Public URL
    location /api/ {
        # Using your backend's public address directly
        proxy_pass https://automl-production-afc0.up.railway.app/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # This tells Railway which service we are talking to
        proxy_set_header Host automl-production-afc0.up.railway.app;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}