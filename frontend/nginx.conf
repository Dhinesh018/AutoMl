server {
    listen ${PORT};  # Will be substituted by Nginx's template engine
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(auth|datasets|train|models|predict|health|api) {
        proxy_pass https://automl-production-afc0.up.railway.app;
        proxy_set_header Host automl-production-afc0.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}