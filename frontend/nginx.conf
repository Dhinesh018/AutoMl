server {
    listen ${PORT};
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(auth|datasets|train|models|predict|health|api) {
        # 1. Use HTTPS but DISABLE verification to fix the handshake
        proxy_pass https://automl-production-afc0.up.railway.app;
        
        # 2. Add a trailing slash to the proxy_pass to prevent Nginx redirects
        # proxy_pass https://automl-production-afc0.up.railway.app/; 

        proxy_set_header Host automl-production-afc0.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Force the upstream to know we are on HTTPS
        
        # 3. CRITICAL: These fix the SSL handshake "Alert 80" without using HTTP
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Keep-alive settings for long ML tasks
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}