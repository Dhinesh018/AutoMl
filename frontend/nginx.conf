server {
    # Railway provides the PORT environment variable
    listen ${PORT};
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # 1. THE BRIDGE: Proxy API calls to your FastAPI backend
    # This catches your routes without needing an '/api' prefix
    location ~ ^/(auth|datasets|train|models|predict|health) {
        proxy_pass https://automl-production-afc0.up.railway.app;
        proxy_set_header Host automl-production-afc0.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ensures that the connection doesn't drop for long ML tasks
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 2. THE FRONTEND: Serve the React/Vite app
    location / {
        try_files $uri $uri/ /index.html;
    }
}